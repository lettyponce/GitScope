
name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ci:
    name: Build, Unit Tests & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests, build and lint
        id: validation
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest assembleDebug lintDebug \
            --no-daemon \
            --console=plain

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob(
              "app/build/test-results/testDebugUnitTest/TEST-*.xml"
          )

          total = 0
          failed = 0
          skipped = 0

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## GitScope — Unit Test Results\n\n")

              if not reports:
                  summary.write(
                      "No JUnit XML reports were found. "
                      "Check the Gradle execution logs.\n"
                  )
              else:
                  for report in reports:
                      root = ET.parse(report).getroot()

                      total += int(root.get("tests", 0))
                      failed += (
                          int(root.get("failures", 0))
                          + int(root.get("errors", 0))
                      )
                      skipped += int(root.get("skipped", 0))

                  passed = total - failed - skipped
                  success_rate = (
                      passed / total * 100 if total else 0
                  )

                  summary.write(
                      "| Metric | Count |\n"
                      "|---|---:|\n"
                      f"| Total tests | {total} |\n"
                      f"| Passed | {passed} |\n"
                      f"| Failed | {failed} |\n"
                      f"| Skipped | {skipped} |\n"
                      f"| Success rate | {success_rate:.1f}% |\n\n"
                  )

                  status = "PASSED" if failed == 0 else "FAILED"
                  summary.write(f"**Test status: {status}**\n")

          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitscope-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if validation failed
        if: steps.validation.outcome == 'failure'
        run: exit 1
